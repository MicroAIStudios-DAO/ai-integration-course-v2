name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'firebase.json'
      - '.github/workflows/deploy-hosting.yml'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Shares the production-deploy group with deploy-production.yml: both
# workflows deploy hosting on push to main, and running them concurrently
# is a race where the last writer wins. Serializing them means whichever
# runs second deploys last — and with identical env mapping (below), both
# produce a working bundle either way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: ai-integra-course-v2

jobs:
  deploy-hosting:
    name: Build & Deploy Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Guard against the empty-secret failure mode: a bundle built without
      # Firebase config deploys "successfully" but never hydrates in browsers.
      - name: Fail fast if Firebase client config is missing
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::REACT_APP_FIREBASE_API_KEY secret is empty/missing — refusing to build a bundle that cannot hydrate."
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
        env:
          # Vite env vars for the production build.
          # CRITICAL: the repo's GitHub secrets are named REACT_APP_* (CRA-era
          # names, same values) — referencing secrets.VITE_* resolves to EMPTY
          # strings, the bundle ships without Firebase config, the runtime env
          # validator throws, and React never hydrates (prod outage of
          # 31 Jul 2026). Mapping mirrors deploy-production.yml exactly.
          VITE_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_ENTERPRISE_KEY }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting
        run: |
          firebase deploy --only hosting \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Hosting Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ env.FIREBASE_PROJECT }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://aiintegrationcourse.com" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
